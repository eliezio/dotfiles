packages:
  # Installed by mise on every platform, always at the latest release.
  # Optional `mise_options` become extra keys in the tool's mise entry.
  # `mise` is the explicit backend id: prefer `aqua:` (upstream release binary,
  # checksum-verified, registry entries reviewed in aquaproj/aqua-registry)
  # over `cargo:`/`go:`/`pipx:`, which build from source, and `asdf:`, which
  # runs third-party plugin scripts.
  cli:
    - name: atuin
      description: Improved shell history for zsh, bash, fish and nushell
      mise: aqua:atuinsh/atuin
    - name: bat
      description: Clone of cat(1) with syntax highlighting and Git integration
      mise: aqua:sharkdp/bat
    - name: btop
      description: Resource monitor. C++ version and continuation of bashtop and bpytop
      mise: aqua:aristocratos/btop
      mise_options:
        os: [linux]  # aqua package is Linux-only; macOS gets btop from Homebrew
    - name: chezmoi
      description: Manage your dotfiles across multiple diverse machines, securely
      mise: aqua:twpayne/chezmoi
    - name: delta
      description: Syntax-highlighting pager for git and diff output
      mise: aqua:dandavison/delta
    - name: diffnav
      description: Git diff pager based on delta but with a file tree
      mise: github:dlvhdr/diffnav  # not in aqua registry
    - name: direnv
      description: Load/unload environment variables based on $PWD
      mise: aqua:direnv/direnv
    - name: doggo
      description: Command-line DNS Client for Humans
      mise: aqua:mr-karan/doggo
    - name: fastfetch
      description: Like neofetch, but much faster because written mostly in C
      mise: aqua:fastfetch-cli/fastfetch
    - name: fd
      description: Simple, fast and user-friendly alternative to find
      mise: aqua:sharkdp/fd
    - name: fzf
      description: Command-line fuzzy finder written in Go
      mise: aqua:junegunn/fzf
    - name: gh
      description: GitHub command-line tool
      mise: aqua:cli/cli
    - name: ghq
      mise: aqua:x-motemen/ghq
    - name: git-lfs
      description: Git extension for versioning large file
      mise: aqua:git-lfs/git-lfs
    - name: glab
      description: Open-source GitLab command-line tool
      mise: gitlab:gitlab-org/cli  # not in aqua registry
    - name: go
      description: Open source programming language to build simple/reliable/efficient software
      mise: go
    - name: herdr
      description: Agent multiplexer that lives in your terminal
      mise: aqua:herdrdev/herdr
    - name: ijq
      description: Interactive jq
      mise: go:codeberg.org/gpanders/ijq  # no release binaries
    - name: jd
      description: JSON diff and patch
      mise: aqua:josephburnett/jd
    - name: jless
      description: Command-line pager for JSON data
      mise: aqua:PaulJuliusMartinez/jless
      mise_options:
        os: [linux/amd64, macos]  # upstream ships no linux/arm64 binary
    - name: jq
      description: Lightweight and flexible command-line JSON processor
      mise: aqua:jqlang/jq
    - name: k9s
      description: Kubernetes CLI To Manage Your Clusters In Style!
      mise: aqua:derailed/k9s
    - name: kubectl
      description: Kubernetes command-line interface
      mise: aqua:kubernetes/kubernetes/kubectl
    - name: kubectx
      description: Tool that can switch between kubectl contexts easily and create aliases
      mise: aqua:ahmetb/kubectx
    - name: lazydocker
      description: Lazier way to manage everything docker
      mise: aqua:jesseduffield/lazydocker
    - name: lazygit
      description: Simple terminal UI for git commands
      mise: aqua:jesseduffield/lazygit
    - name: lsd
      description: Clone of ls with colorful output, file type icons, and more
      mise: aqua:lsd-rs/lsd
    - name: neovim
      description: Ambitious Vim-fork focused on extensibility and agility
      mise: aqua:neovim/neovim  # registry default is vfox
    - name: nodejs
      description: Open-source, cross-platform JavaScript runtime environment
      mise: node
    - name: pgcli
      description: CLI for Postgres with auto-completion and syntax highlighting
      mise: pipx:pgcli  # Python app; no release binary
      mise_options:
        uvx_args: --with psycopg-binary  # bundles libpq; no system libpq needed
    - name: ripgrep
      description: Search tool like grep and The Silver Searcher
      mise: aqua:BurntSushi/ripgrep
    - name: sops
      description: Editor of encrypted files
      mise: aqua:getsops/sops
    - name: starship
      description: Cross-shell prompt for astronauts
      mise: aqua:starship/starship
    - name: tealdeer
      description: Very fast implementation of tldr in Rust
      mise: aqua:tealdeer-rs/tealdeer
    - name: topgrade
      description: Upgrade all the things
      mise: github:topgrade-rs/topgrade  # mise registry requires attestations here, not on aqua:
    - name: tree-sitter-cli
      description: Parser generator tool
      mise: aqua:tree-sitter/tree-sitter
    - name: uv
      description: Extremely fast Python package installer and resolver, written in Rust
      mise: aqua:astral-sh/uv
    - name: worktrunk
      description: CLI for Git worktree management, designed for parallel AI agent workflows
      mise: aqua:max-sixty/worktrunk
    - name: xh
      description: Friendly and fast tool for sending HTTP requests
      mise: aqua:ducaale/xh
    - name: yazi
      description: Blazing fast terminal file manager written in Rust, based on async I/O
      mise: aqua:sxyazi/yazi
    - name: yq
      description: Process YAML, JSON, XML, CSV and properties documents from the CLI
      mise: aqua:mikefarah/yq
    #- name: yt-dlp  # excluded as it depends on deno, whose build significantly slows down installation
    - name: zoxide
      description: Shell extension to navigate your filesystem faster
      mise: aqua:ajeetdsouza/zoxide
  # Installed by the platform package manager. No source yet on Debian or Fedora.
  gui:
    - name: font-jetbrains-mono-nerd-font
      description: JetBrainsMono Nerd Font families (JetBrains Mono)
      arch: ttf-jetbrains-mono-nerd
      brew_cask: true
    - name: font-fira-mono-nerd-font
      description: FiraMono Nerd Font (Fira)
      arch: otf-firamono-nerd
      brew_cask: true
    - name: ghostty
      description: Terminal emulator that uses platform-native UI and GPU acceleration
      brew_cask: true
  # Installed by the platform package manager: base tools, anything without a
  # mise backend, and mise itself where the package keeps up (Arch and Debian
  # use the mise.run installer instead; see scripts/lib/mise_run.sh).
  system:
    brew:
      - btop  # no macOS build in aqua (see packages.cli)
      - gcc
      - git
      - less
      - luarocks
      - mise
      - openssh
      - tig
      - unzip
      - wget
      - xmlstarlet
      - zip
    arch:
      - gcc
      - git
      - less
      - luarocks
      - make
      - openssh
      - tig
      - unzip
      - wget
      - xclip
      - xmlstarlet
      - zip
      - zsh
    debian:
      - ca-certificates
      - curl
      - gcc
      - git
      - less
      - luarocks
      - make
      - openssh-client
      - tig
      - unzip
      - wget
      - xclip
      - xmlstarlet
      - zip
      - zsh
    # Aurora (atomic Fedora): installed with the image's Homebrew, not dnf.
    # git, gcc and zsh already ship in the Aurora image.
    fedora:
      - luarocks
      - make
      - mise
      - tig
      - unzip
      - wget
      - xclip
      - xmlstarlet
      - zip
